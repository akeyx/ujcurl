name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B package
      - run: cp target/ujcurl-*-SNAPSHOT.jar ujcurl.jar
      - run: gh release create "$GITHUB_REF_NAME" ujcurl.jar --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
